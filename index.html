.link{background:none;border:0;color:var(--b2);font-size:14px;margin:10px 0;font-family:inherit;padding:0}

{k:["比例"],t:"「比例」：例如過去約診中沒到（或準時到）的次數，占全部約診次數的多少。"}];

const ICON={dentist:["📅","🔄","📒","🤔","🔁","📊","⏱️","🆕","⏳","⌚","⌛","🔔","❓","⚡","😎","📉","⚖️","📣"],patient:["🦷","🔍","📞","🗓️","🚪","🙈","📲","🎟️","📊","✅","😟","🗂️","✍️","⏳","⌛","🧭","🚀"]};
const GRAD=[["#4C76AD","#214B82"],["#5B9988","#214B82"],["#D0721F","#214B82"],["#4C76AD","#5B9988"],["#35629C","#082244"],["#5B9988","#33715F"]];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function termsOf(q){return TERMS.filter(g=>g.k.some(k=>q.includes(k)))}
function markQ(q){const ks=TERMS.flatMap(g=>g.k).filter(k=>q.includes(k));if(!ks.length)return esc(q);
const re=new RegExp('('+ks.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
return q.split(re).map((p,i)=>i%2?`<span class="term">${esc(p)}</span>`:esc(p)).join('')}
// 部署時填入 Apps Script web app 網址（/exec 結尾）；空字串＝不送出，只留本機
const ENDPOINT="https://script.google.com/macros/s/AKfycbyhqEaAxubOr8nof4ukRDhcDOwMAOUk-XjdF68DpD08vT8gSusEJnFta9Ns96La0hGY/exec";
const KEY="dentalk_survey_v05";let st={role:null,i:0,ans:[],t0:null,tr:{}};const app=document.getElementById('app'),bar=document.getElementById('bar'),cnt=document.getElementById('cnt');let paused=false,busy=false;
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function start(){bar.style.width=0;cnt.textContent='';app.innerHTML=`<div class="screen"><div class="cover"><svg viewBox="0 0 360 150" preserveAspectRatio="xMidYMid slice" fill="none"><g stroke="#4C76AD" stroke-width="1" opacity=".35">${[0,1,2,3,4,5].map(k=>`<circle cx="300" cy="40" r="${20+k*22}"/>`).join('')}</g><rect x="40" y="38" width="86" height="112" rx="10" fill="#fff" opacity=".55" transform="rotate(-8 83 94)"/><rect x="62" y="30" width="86" height="112" rx="10" fill="#fff" stroke="#214B82" stroke-opacity=".25"/><rect x="76" y="50" width="40" height="4" rx="2" fill="#214B82"/><rect x="76" y="62" width="58" height="3" rx="1.5" fill="#4C76AD" opacity=".5"/><rect x="76" y="70" width="50" height="3" rx="1.5" fill="#4C76AD" opacity=".5"/><circle cx="84" cy="122" r="7" stroke="#B9473C" stroke-width="1.5"/><circle cx="126" cy="122" r="7" fill="#5B9988"/><path d="M0 150 C90 112 200 160 360 118 L360 150Z" fill="#214B82" opacity=".08"/></svg></div>
<div class="ttl">3 分鐘，幫我們把看牙變簡單</div><p class="lead">本問卷是「幫幫我牙！」的研究用展示版，約 3 分鐘。<br>請依你<b>實際的經驗</b>作答，沒有標準答案；不需提供任何病情資料。</p>
<div class="legend"><div><b style="color:var(--g2)">是</b>右滑・點「是」</div><div><b style="color:var(--red)">否</b>左滑・點「否」</div><div><b style="color:var(--b1)">跳過</b>上滑・點「跳過」</div></div>
<p class="small" style="margin:0">不想滑也可以，按下方「是／否」按鈕。看到 <b style="color:var(--o)">ⓘ</b> 可翻面看名詞說明。</p>
<h2 class="ask"><span>01</span>你的身份是？</h2><button class="big" onclick="pick('dentist')"><span class="ic">🦷</span><span>我是牙醫<small>${Q.dentist.length} 張卡・診所經驗</small></span><span class="go">›</span></button><button class="big" onclick="pick('patient')"><span class="ic">🙋</span><span>我是民眾<small>${Q.patient.length} 張卡・看牙經驗</small></span><span class="go">›</span></button></div>`}
function pick(r){st={role:r,i:0,ans:[],t0:new Date().toISOString(),tr:{}};save();render()}
function vis(i){return ''}
const ACC=["#214B82","#4C76AD","#5B9988","#214B82","#D0721F","#33715F"];
function front(c,i,full){const ab=c.ab,tg=termsOf(c.q),L=Q[st.role],n=String(i+1).padStart(2,'0'),ic=(ICON[st.role]||[])[i]||'';
const stamps=full?`<div class="stamp sr${ab?' small':''}">${ab?esc(ab[1]):'是'}</div><div class="stamp sl${ab?' small':''}">${ab?esc(ab[0]):'否'}</div><div class="stamp su">跳過</div>`:'';
return `<div class="face front" style="--acc:${ACC[i%ACC.length]}">${stamps}<div class="meta"><span class="qn">Q${n} / ${L.length}</span><span class="sec">${esc(c.s)}</span>${ab?'<span class="chip-ab">二選一</span>':''}</div><div class="ill">${ic}</div><div class="q">${full?markQ(c.q):esc(c.q)}</div>${ab?`<div class="ab"><span><i>← 左滑</i>${esc(ab[0])}</span><span><i>右滑 →</i>${esc(ab[1])}</span></div>`:(full?'<div class="hint">右滑＝是・左滑＝否・上滑＝跳過</div>':'')}${full?`<div class="tools">${tg.length?`<button class="pill info" id="bi">ⓘ 名詞說明${tg.length>1?'（'+tg.length+'）':''}</button>`:''}<button class="pill" id="bn">✉ 補充</button></div>`:''}</div>`}
function render(enterAnim){paused=false;busy=false;const L=Q[st.role];bar.style.width=(st.i/L.length*100)+'%';if(st.i>=L.length)return done();
if(L[st.i].tr&&!(st.tr||{})[L[st.i].code])return trans(L[st.i]);cnt.textContent=`${st.i+1} / ${L.length}`;const c=L[st.i],tg=termsOf(c.q);
const nx=L[st.i+1],n2=L[st.i+2];
app.innerHTML=`<div class="stack">${n2?`<div class="card third">${front(n2,st.i+2,false)}</div>`:''}${nx?`<div class="card next" id="nextc"><div class="inner">${front(nx,st.i+1,false)}</div></div>`:''}<div class="card top${enterAnim?' enter':''}" id="card"><div class="inner">${front(c,st.i,true)}<div class="face back"><h3>ⓘ 名詞說明</h3>${tg.map(g=>`<div class="it">${esc(g.t)}</div>`).join('')}<div class="qq">題目：${esc(c.q)}</div><span class="paused">翻面時暫停滑動</span><button id="pclose">↺ 翻回題目</button></div></div>
<div class="sheet" id="sheet"><b>✉ 補充（選填）</b><input class="note" id="note" maxlength="120" placeholder="${c.hint?esc(c.hint):'（選填）想補充一句嗎？'}"><span class="paused">補充欄開啟時暫停滑動</span><button id="nclose">完成</button></div></div></div>
<div class="btns"><div class="mainb"><button class="tb no" aria-label="否" onclick="tap(this,'left')">${c.ab?esc(c.ab[0]):'否'}</button><button class="tb yes" aria-label="是" onclick="tap(this,'right')">${c.ab?esc(c.ab[1]):'是'}</button></div><div class="subb"><button class="tb2" aria-label="上一題" onclick="tap(this,'back')" ${st.i>0?'':'disabled'}>上一題</button><span class="dot">·</span><button class="tb2" aria-label="跳過" onclick="tap(this,'up')">跳過</button></div></div>`;
const card=document.getElementById('card'),sheet=document.getElementById('sheet'),note=document.getElementById('note'),bn=document.getElementById('bn'),bi=document.getElementById('bi');
const stop=e=>e.stopPropagation();
if(bi){bi.addEventListener('pointerdown',stop);bi.onclick=e=>{e.stopPropagation();card.classList.add('flipped');paused=true}}
document.getElementById('pclose').addEventListener('pointerdown',stop);document.getElementById('pclose').onclick=e=>{e.stopPropagation();card.classList.remove('flipped');paused=false};
card.querySelector('.back').addEventListener('pointerdown',stop);
bn.addEventListener('pointerdown',stop);bn.onclick=e=>{e.stopPropagation();sheet.classList.add('on');paused=true;setTimeout(()=>note.focus(),50)};
sheet.addEventListener('pointerdown',stop);document.getElementById('nclose').onclick=e=>{e.stopPropagation();sheet.classList.remove('on');paused=false;bn.classList.toggle('has',!!note.value.trim());bn.textContent=note.value.trim()?'✉ 已補充':'✉ 補充'};
drag(card)}
function trans(c){paused=true;cnt.textContent='說明';app.innerHTML=`<div class="screen" id="trans"><div class="ttl">換個話題 👉</div><p class="lead" id="trtext">${esc(c.tr)}</p><p class="small">（這張是說明，不用作答）</p><button class="primary" id="trgo">繼續</button></div>`;
document.getElementById('trgo').onclick=()=>{st.tr=st.tr||{};st.tr[c.code]=1;save();render(true)}}
function tap(b,d){b.classList.add('press');setTimeout(()=>b.classList.remove('press'),180);if(d==='back')back();else answer(d)}
function answer(d){if(paused||busy)return;const c=Q[st.role][st.i],card=document.getElementById('card');if(!card||card.dataset.gone)return;card.dataset.gone=1;busy=true;
const val=d==='up'?'不確定/跳過':c.ab?(d==='left'?c.ab[0]:c.ab[1]):(d==='right'?'是/同意':'否/不同意');
st.ans[st.i]={no:st.i+1,q:c.q,source:c.src,code:c.code,swipe:d,answer:val,note:document.getElementById('note').value.trim()};st.i++;save();
const s=card.querySelector(d==='up'?'.su':d==='left'?'.sl':'.sr');if(s)s.style.opacity=1;
const cur=card.style.transform;card.classList.remove('top');card.classList.add('fly');card.style.zIndex=5;
const go=()=>{card.style.transform=d==='up'?'translateY(-140%) scale(.9)':`translate(${d==='left'?-160:160}%,40px) rotate(${d==='left'?-28:28}deg)`;card.style.opacity=0};
const nc=document.getElementById('nextc');if(nc)nc.classList.add('up');
if(!cur){setTimeout(go,140)}else go();
setTimeout(()=>render(false),cur?420:560)}
function back(){if(busy||paused||st.i<=0)return;if(Q[st.role][st.i].tr&&st.tr)delete st.tr[Q[st.role][st.i].code];st.i--;st.ans.length=st.i;save();render(true)}
function drag(el){let x0,y0,dx=0,dy=0,on=false,lt=0,lx=0,vx=0;const sl=el.querySelector('.sl'),sr=el.querySelector('.sr'),su=el.querySelector('.su'),nc=document.getElementById('nextc');
const fx=(r,l,u)=>{sr.style.opacity=r;sl.style.opacity=l;su.style.opacity=u};const cl=v=>Math.min(1,Math.max(0,v));
el.addEventListener('pointerdown',e=>{if(paused||busy)return;on=true;x0=e.clientX;y0=e.clientY;lx=x0;lt=performance.now();el.classList.add('drag');el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!on||paused)return;dx=e.clientX-x0;dy=e.clientY-y0;const t=performance.now();vx=(e.clientX-lx)/Math.max(1,t-lt);lx=e.clientX;lt=t;
el.style.transform=`translate(${dx}px,${dy}px) rotate(${Math.max(-20,Math.min(20,dx/14))}deg)`;fx(cl(dx/100),cl(-dx/100),cl(-dy/100-Math.abs(dx)/100));
if(nc){const p=cl(Math.max(Math.abs(dx),-dy)/140);nc.style.transition='none';nc.style.transform=`translateY(${14-14*p}px) scale(${.94+.06*p})`}});
const end=()=>{if(!on)return;on=false;el.classList.remove('drag');if(nc){nc.style.transition='';nc.style.transform=''}
if(dx>100||(dx>40&&vx>.6))answer('right');else if(dx<-100||(dx<-40&&vx<-.6))answer('left');else if(dy<-100&&Math.abs(dx)<80)answer('up');else{el.style.transform='';fx(0,0,0)}dx=dy=0;vx=0};
el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function result(){return JSON.stringify({survey:"幫幫我牙！訪談滑卡問卷 v5（白話版）",role:st.role==='dentist'?'牙醫':'民眾',started:st.t0,finished:new Date().toISOString(),answers:st.ans},null,2)}
function send(j){if(!ENDPOINT)return Promise.resolve(false);return fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:j}).then(()=>true).catch(()=>false)}
function done(){bar.style.width='100%';cnt.textContent='完成';const j=result();const trySend=()=>{const rb=document.getElementById('resend');if(rb)rb.hidden=true;{const t=document.getElementById('ttl');if(t)t.textContent='送出中…'}send(j).then(ok=>{const m=document.getElementById('sent');const sv=document.getElementById('saved');const rb=document.getElementById('resend');if(sv)sv.hidden=!ok;if(rb)rb.hidden=ok;if(m)m.textContent=ok?'✅ 答案已送出':'送出失敗，請檢查網路後再按一次';const t=document.getElementById('ttl');const k=document.getElementById('okmark');if(t)t.textContent=ok?'謝謝你的回答！':'還沒送出成功';if(k)k.textContent=ok?'✓':'!'})};localStorage.setItem(KEY+'_result_'+Date.now(),j);
const A=st.ans,y=A.filter(a=>a.swipe==='right').length,n=A.filter(a=>a.swipe==='left').length,u=A.filter(a=>a.swipe==='up').length;
app.innerHTML=`<div class="screen done"><div class="ok" id="okmark">…</div><div class="ttl" id="ttl">送出中…</div><p class="lead">${Q[st.role].length} 張卡都完成了</p><div class="stats"><div><b style="color:var(--g2)">${y}</b>右滑</div><div><b style="color:var(--red)">${n}</b>左滑</div><div><b style="color:var(--b1)">${u}</b>跳過</div></div><p class="small" id="sent"></p><p class="small" id="saved" hidden>你的回答已匿名存到 Dentalk 的研究試算表，只用於產品研究。</p><button class="link" onclick="localStorage.removeItem(KEY);start()">重新開始</button></div><div class="foot"><div class="in"><button class="primary" id="resend" hidden>重新送出</button></div></div>`;
document.getElementById('resend').onclick=trySend;trySend()}
document.addEventListener('keydown',e=>{if(!st.role||paused||st.i>=Q[st.role].length||e.target.id==='note')return;if(e.key==='ArrowLeft')answer('left');if(e.key==='ArrowRight')answer('right');if(e.key==='ArrowUp')answer('up');if(e.key==='Backspace')back()});
(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.role&&s.i<Q[s.role].length){st=s;return render()}}catch(e){}start()})();
</script></body></html>
