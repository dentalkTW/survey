<meta name="theme-color" content="#FFFFFF">
<style>

.card.next.up{transform:none}
.card.third{z-index:1;transform:translateY(16px) scale(.93)}.card.third .face>*{visibility:hidden}
.card.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}

.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.2,.5,1)}
.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:8px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
.front{display:flex;flex-direction:column;padding:24px 22px 18px}
.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--p500))}

.qn{font-family:Roboto,sans-serif;font-weight:700;color:var(--p700);font-size:12.5px;letter-spacing:.08em;background:var(--p100);padding:2px 8px;border-radius:6px}
.sec{color:var(--mut)}.sec:before{content:none}

.stamp.su{left:50%;top:auto;bottom:84px;transform:translateX(-50%) rotate(-4deg);color:var(--p700);border-color:var(--p500)}
.back{transform:rotateY(180deg);padding:24px 22px 18px;display:flex;flex-direction:column;gap:14px}

.privacy{font-size:13px;line-height:1.6;color:var(--o-ink)}.contact{margin-top:14px;display:flex;flex-direction:column;gap:6px}.contact label{font-size:13px;font-weight:500;color:var(--ink)}.contact .privacy{font-size:12.5px;line-height:1.5}

.back button:hover,.sheet button:hover{background:var(--p700);border-color:var(--p700)}

.note:focus{outline:none;border-color:var(--p500);box-shadow:0 0 0 3px var(--p100)}
/* 是／否：同樣中性的直角外框按鈕（v5.1 起兩個按鈕刻意同色，避免引導答案） */
.btns{display:flex;flex-direction:column;gap:4px;width:100%;padding:14px 0 calc(10px + env(safe-area-inset-bottom));align-items:stretch}
.mainb{display:flex;gap:10px}.tb{flex:1;min-width:0;min-height:54px;border-radius:0;font-size:17px;font-weight:500;letter-spacing:.1em;line-height:1.35;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .15s;padding:8px 10px;white-space:normal;word-break:break-all}

.ttl{font-size:24px;line-height:1.45;color:var(--p900);font-weight:700;margin:22px 0 10px}

.small{font-size:13px;color:var(--mut);line-height:1.7}

.foot .in{max-width:444px;margin:0 auto}
.primary{width:100%;padding:15px;border:1px solid var(--p500);border-radius:0;background:var(--p500);color:#fff;font-size:16px;font-weight:500;letter-spacing:.1em;cursor:pointer;transition:background .15s}
.primary:hover,.primary:active{background:var(--p700);border-color:var(--p700)}
#trans .primary{margin-top:18px}
.done{position:relative}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--s200);border:0;color:var(--s800);font-size:30px;font-weight:700;display:grid;place-items:center;margin:34px 0 0;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.done .ok.fail{background:var(--o100);color:var(--o-ink)}.done .ok.wait{background:var(--p100);color:var(--p700)}
.done #sent{font-weight:700;color:var(--s800)}
.done #saved{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow);color:var(--ink);font-size:13.5px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.link{background:none;border:0;color:var(--p500);font-size:14px;margin:12px 0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.legal{background:var(--p900);color:#E5E7EB;text-align:center;font-size:12px;letter-spacing:.04em;padding:14px 16px;line-height:1.6}
.foot.has-legal{padding:0}.foot.has-legal .in{padding:12px 18px}.foot.has-legal .in:has(> [hidden]:only-child){display:none}
.foot .legal{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
/* 首頁：與 11/12 社群圖同一套 */

.hlogo{height:34px;width:auto;display:block}
.tags{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:.04em}

.tag.g{background:var(--s200);color:var(--s800);font-size:14px;padding:5px 12px}
.htitle{font-size:44px;line-height:1.15;margin:0;color:var(--p900);font-weight:900;letter-spacing:.02em}
.hsub{font-size:21px;font-weight:700;color:var(--p700);margin:8px 0 0;letter-spacing:.04em}
.hbar{width:56px;height:4px;background:var(--p500);margin:14px 0 16px}
.hlead{font-size:18px;font-weight:700;color:var(--ink);margin:0 0 6px}
.hbody{font-size:14.5px;line-height:1.75;color:#4B5563;margin:0}
.hbody b{color:var(--ink)}
.hcard{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:14px 16px;margin:18px 0 0}
.hcard .k{font-size:12.5px;color:var(--mut);margin-bottom:4px}
.hcard .gest{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--p900)}
.hcard .gest span{white-space:nowrap}
.hcard .s{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.6}
.hcard .s b{color:var(--o-ink)}
.ask{font-size:15px;color:var(--p900);margin:22px 0 10px;font-weight:700}
.role{display:flex;align-items:center;width:100%;padding:15px 18px;margin:0 0 10px;border:1px solid var(--p500);border-radius:0;background:var(--p500);color:#fff;font-size:16px;font-weight:500;letter-spacing:.08em;text-align:left;cursor:pointer;transition:background .15s}
.role:hover,.role:active{background:var(--p700);border-color:var(--p700)}
.role small{font-size:12.5px;font-weight:400;letter-spacing:.02em;opacity:.92;margin-left:8px}
.role .go{margin-left:auto;font-size:14px;letter-spacing:.06em}
.hnote{font-size:12px;color:var(--mut);line-height:1.65;margin:10px 0 0}
.home .legal{margin-top:22px}
@media (max-height:700px){.hc .ill{display:none}.hc .q{margin-top:8px}.contact{margin-top:8px}.contact .privacy{font-size:12px;line-height:1.4}.front{padding:18px 20px 12px}.ill{width:40px;height:40px;font-size:20px;margin:10px 0 8px;flex:none}.q{font-size:19px;line-height:1.5}.hint{margin-top:8px}.ab{margin-top:12px;gap:8px}.ab span{padding:9px 12px}.tools{padding-top:10px}.htitle{font-size:38px}}
@media (max-height:600px){.front{padding:12px 14px 8px}.hc .q{font-size:16.5px;line-height:1.4;margin-top:2px}.hc .hint{font-size:12px;margin-top:4px;line-height:1.4}.hc .contact{margin-top:6px}.hc .contact .privacy{font-size:11.5px;line-height:1.35}.hc .tools{padding-top:4px}.hc .pill{padding:2px 0}.hc .meta{font-size:12px}}
</style></head><body>
<header><div class="brand"><img src="logo-blue.svg" alt="Dentalk"><h1>幫幫我牙！使用經驗小調查</h1><span id="cnt"></span></div><div class="prog"><i id="bar"></i></div></header><div class="banner"><div><b>Dentalk 展示用問卷</b>：這是做產品研究用的試做版，不是正式服務。回答會存到 Dentalk 的研究試算表，只用於產品研究。補充欄沒寫個人資料，就是匿名。</div></div>
<main id="app"></main>
<script>
